name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --workspace
      - run: cargo test --workspace --features pallet-core/failpoints

  windows-native:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # This is deliberately a native MSVC execution, not a GNU cross-check.
      - name: Run the native Windows handle-rename proof
        shell: pwsh
        run: |
          cargo test -p pallet-core --test windows_proof -- --nocapture 2>&1 |
            Tee-Object -FilePath windows-proof.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $required = @(
            'native_rename_and_reverse_preserve_identity_and_bytes ... ok',
            'native_rename_refuses_collision_without_changing_either_file ... ok',
            'native_reverse_rename_refuses_when_original_location_is_occupied ... ok'
          )
          foreach ($test in $required) {
            if (-not (Select-String -Path windows-proof.log -SimpleMatch -Pattern $test -Quiet)) {
              throw "Required Windows native proof did not pass: $test"
            }
          }
      - name: Build the Windows Tauri binary with MSVC
        run: cargo build -p pallet
      - run: cargo check --workspace
      - name: Upload Windows native-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-test-output
          path: windows-proof.log
          if-no-files-found: warn
