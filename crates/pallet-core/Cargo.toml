[package]
name = "pallet-core"
description = "Confined, journaled file moves for the PALLET warehouse"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Crash-test hooks. Never enabled in the shipped app.
failpoints = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
crc32fast = "1.5.3"
blake3 = "1.8.7"
getrandom = "0.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }
landlock = "0.4.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.12.0"

[[bin]]
name = "pallet-crashtest"
path = "src/bin/crashtest.rs"
required-features = ["failpoints"]
